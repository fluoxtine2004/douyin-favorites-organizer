<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="抖音收藏知识库 · Douyin Favorites Organizer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f8ff"/>
      <stop offset="55%" stop-color="#f3f1ff"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbfbfe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#312e81" flood-opacity="0.10"/>
    </filter>
    <style>
      .t  { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
      .h1 { font-size:40px; font-weight:700; fill:#111827; letter-spacing:.5px; }
      .h2 { font-size:15px; font-weight:600; fill:#8b93a1; letter-spacing:2.4px; }
      .tag{ font-size:16px; font-weight:500; fill:#4b5563; }
      .st { font-size:13px; font-weight:600; fill:#4f46e5; }
      .sd { font-size:11.5px; fill:#8b93a1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="298" rx="23" fill="none" stroke="#e8eaee"/>

  <!-- 左侧 logo -->
  <g transform="translate(64,78)">
    <rect width="96" height="96" rx="26" fill="url(#logo)" filter="url(#sh)"/>
    <!-- 书 + 播放 的抽象记号 -->
    <path d="M26 30h20a8 8 0 0 1 8 8v30a8 8 0 0 0-8-8H26z" fill="#ffffff" opacity=".95"/>
    <path d="M70 30H50a8 8 0 0 0-8 8v30a8 8 0 0 1 8-8h20z" fill="#ffffff" opacity=".72"/>
    <path d="M48 42l14 8-14 8z" fill="#4f46e5"/>
  </g>

  <!-- 标题 -->
  <text class="t h1" x="192" y="122">抖音收藏知识库</text>
  <text class="t h2" x="194" y="150">DOUYIN FAVORITES ORGANIZER</text>
  <text class="t tag" x="192" y="186">把「收藏了等于没收藏」变成可检索、可回顾、能执行的私人知识库</text>

  <!-- 特性小标签 -->
  <g transform="translate(192,206)">
    <g>
      <rect width="112" height="26" rx="13" fill="#eef2ff"/>
      <text class="t st" x="14" y="18">本地逐字稿</text>
    </g>
    <g transform="translate(120,0)">
      <rect width="112" height="26" rx="13" fill="#ecfdf5"/>
      <text class="t st" x="14" y="18" fill="#059669">要点 · 时间轴</text>
    </g>
    <g transform="translate(240,0)">
      <rect width="128" height="26" rx="13" fill="#fffbeb"/>
      <text class="t st" x="14" y="18" fill="#b45309">Obsidian 笔记</text>
    </g>
    <g transform="translate(376,0)">
      <rect width="112" height="26" rx="13" fill="#eff6ff"/>
      <text class="t st" x="14" y="18" fill="#0284c7">周 / 季 / 年</text>
    </g>
  </g>

  <!-- 右侧：管线示意 收藏夹 → 逐字稿 → 知识库 -->
  <g transform="translate(806,58)">
    <!-- 卡片 1 -->
    <g filter="url(#sh)">
      <rect width="118" height="92" rx="16" fill="url(#card)" stroke="#e8eaee"/>
      <rect x="14" y="16" width="42" height="34" rx="6" fill="#eef2ff"/>
      <path d="M14 30h42" stroke="#c7d2fe" stroke-width="2"/>
      <path d="M14 22h42" stroke="#c7d2fe" stroke-width="2"/>
      <rect x="14" y="60" width="72" height="6" rx="3" fill="#e9ecf2"/>
      <rect x="14" y="72" width="52" height="6" rx="3" fill="#eff1f5"/>
    </g>
    <text class="t sd" x="59" y="110" text-anchor="middle">收藏夹</text>

    <!-- 箭头 -->
    <g transform="translate(126,38)">
      <path d="M0 8h30" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M26 2l8 6-8 6z" fill="#a5b4fc"/>
    </g>

    <!-- 卡片 2 -->
    <g transform="translate(162,0)">
      <g filter="url(#sh)">
        <rect width="118" height="92" rx="16" fill="url(#card)" stroke="#e8eaee"/>
        <rect x="14" y="16" width="90" height="44" rx="7" fill="#111827" opacity=".05"/>
        <path d="M52 30l18 10-18 10z" fill="#6366f1"/>
        <path d="M14 68h90" stroke="#e9ecf2" stroke-width="2"/>
        <path d="M14 76h58" stroke="#eff1f5" stroke-width="2"/>
      </g>
      <text class="t sd" x="59" y="110" text-anchor="middle">逐字稿 · 截图</text>
    </g>

    <!-- 箭头 -->
    <g transform="translate(288,38)">
      <path d="M0 8h30" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M26 2l8 6-8 6z" fill="#a5b4fc"/>
    </g>

    <!-- 卡片 3 -->
    <g transform="translate(324,0)">
      <g filter="url(#sh)">
        <rect width="118" height="92" rx="16" fill="url(#card)" stroke="#e8eaee"/>
        <rect x="14" y="16" width="90" height="8" rx="4" fill="url(#accent)"/>
        <rect x="14" y="32" width="72" height="6" rx="3" fill="#e9ecf2"/>
        <rect x="14" y="44" width="90" height="6" rx="3" fill="#eff1f5"/>
        <rect x="14" y="56" width="60" height="6" rx="3" fill="#eff1f5"/>
        <circle cx="92" cy="72" r="10" fill="#eef2ff"/>
        <path d="M88 72l3 3 6-6" stroke="#4f46e5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text class="t sd" x="59" y="110" text-anchor="middle">知识库</text>
    </g>
  </g>
</svg>
