<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音收藏知识库</title>
<style>
  :root{
  --bg:#f6f7f9;--card:#fff;--border:#e8eaee;--border-strong:#dcdfe6;--text:#111827;--text-2:#4b5563;--muted:#8b93a1;
  --primary:#4f46e5;--primary-light:#eef2ff;--primary-line:#c7d2fe;--chip:#f3f4f6;--star:#f59e0b;--star-soft:#fffbeb;
  --review:#0284c7;--review-soft:#eff6ff;--ok:#059669;--ok-soft:#ecfdf5;--danger:#dc2626;--danger-soft:#fef2f2;
  --sh1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--sh2:0 4px 16px rgba(16,24,40,.09);
}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  a{color:var(--primary);text-decoration:none;}
  header{background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border);padding:12px 24px 0;position:sticky;top:0;z-index:20;}
  .h-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .h-top h1{font-size:17px;margin-right:auto;font-weight:650;}
  .badge{font-size:12px;background:var(--primary-light);color:var(--primary);padding:3px 10px;border-radius:999px;font-weight:600;}
  .search{display:flex;min-width:200px;max-width:300px;flex:1;}
  .search input{flex:1;border:1px solid var(--border);border-radius:8px 0 0 8px;padding:7px 11px;font-size:14px;outline:none;}
  .search input:focus{border-color:var(--primary);}
  .btn{border:none;background:var(--primary);color:#fff;padding:7px 13px;font-size:13.5px;cursor:pointer;border-radius:0 8px 8px 0;}
  nav{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  nav button{border:none;background:transparent;padding:6px 11px;font-size:13px;border-radius:999px;cursor:pointer;color:var(--text-2);font-family:inherit;transition:.15s;}
  nav button.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(79,70,229,.35);}
  nav .cnt{font-size:11px;margin-left:4px;color:var(--muted);}
  nav .sep{width:1px;height:18px;background:var(--border);margin:0 4px;}
  nav .toggle{font-size:13px;color:var(--muted);cursor:pointer;border:1px solid var(--border);border-radius:8px;padding:5px 10px;background:#fff;}
  nav .toggle.on{border-color:var(--star);color:var(--star);background:#fffbeb;font-weight:600;}
  nav select.lv2sel{border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:13px;background:#fff;color:var(--text);outline:none;max-width:240px;cursor:pointer;font-family:inherit;}
  nav select.lv2sel:focus{border-color:var(--primary);}
  nav select.lv2sel.on{border-color:var(--primary);color:var(--primary);font-weight:600;background:var(--primary-light);}
  main{max-width:1180px;margin:20px auto 60px;padding:0 24px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;flex:1;min-width:110px;box-shadow:var(--sh1);}
  .stat b{font-size:20px;color:var(--primary);display:block;}
  .stat span{font-size:12px;color:var(--muted);}
  .summary-card{background:linear-gradient(135deg,#eef2ff,#fdf4ff);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:16px;white-space:pre-wrap;line-height:1.85;font-size:14px;}
  details.wk{margin-bottom:14px;}
  details.wk>summary{cursor:pointer;font-size:13px;color:var(--text-2);user-select:none;border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 13px;display:inline-block;font-weight:600;}
  details.wk>summary:hover{border-color:var(--primary);color:var(--primary);}
  details.wk[open]>summary{margin-bottom:10px;}
  details.wk .summary-card{margin-bottom:0;}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar button{border:1px solid var(--border-strong);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--text-2);font-family:inherit;transition:.15s;}
  .toolbar button:hover{border-color:var(--primary);color:var(--primary);}
  .toolbar select.sortsel{border:1px solid var(--border-strong);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--text-2);font-family:inherit;cursor:pointer;outline:none;transition:.15s;}
  .toolbar select.sortsel:hover{border-color:var(--primary);color:var(--primary);}
  /* ---- 列表：简洁 ---- */
  .row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:.16s;box-shadow:var(--sh1);}
  .row:hover{border-color:var(--primary-line);box-shadow:var(--sh2);transform:translateY(-1px);}
  .thumb{width:86px;height:54px;border-radius:7px;flex-shrink:0;object-fit:cover;background:linear-gradient(135deg,#6366f1,#8b5cf6);}
  .row-main{flex:1;min-width:0;}
  .row-title{font-size:14.5px;font-weight:600;line-height:1.45;display:flex;gap:6px;align-items:flex-start;}
  .row-title .mk{font-size:13px;flex-shrink:0;}
  .row-sum{margin-top:3px;font-size:13px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .chip{font-size:11.5px;background:var(--chip);padding:2px 8px;border-radius:999px;color:var(--muted);}
  .chip.major{background:var(--primary-light);color:var(--primary);font-weight:600;}
  .chip.folder{background:#ecfdf5;color:#059669;}
  .chip.new{background:#fef2f2;color:#dc2626;font-weight:600;}
  .chip.wait{background:#f9fafb;color:#9ca3af;}
  /* ---- 详情：详细 ---- */
  .detail{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px 28px;box-shadow:var(--sh1);}
  .back{border:none;background:transparent;color:var(--primary);font-size:13.5px;cursor:pointer;padding:4px 0;margin-bottom:8px;}
  .d-title{font-size:21px;font-weight:700;line-height:1.4;}
  .d-full{font-size:12.5px;color:var(--muted);margin-top:6px;white-space:pre-wrap;}
  .d-meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
  .d-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 6px;}
  .d-actions button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}
  .d-actions button.on{background:#fffbeb;border-color:var(--star);color:#b45309;font-weight:600;}
  .d-actions button.rev.on{background:#eff6ff;border-color:var(--review);color:#0369a1;font-weight:600;}
  .sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
  .sec h3{font-size:15px;margin-bottom:10px;font-weight:650;}
  .sum-box{background:#f8fafc;border-left:3px solid var(--primary);border-radius:8px;padding:12px 14px;font-size:14px;}
  .points{margin:0 0 0 18px;line-height:1.9;font-size:13.5px;}
  /* 时间轴 */
  .tl{position:relative;margin-top:6px;}
  .tl-item{display:flex;gap:14px;padding:10px 0;border-bottom:1px dashed var(--border);}
  .tl-item:last-child{border-bottom:none;}
  .tl-time{flex-shrink:0;width:58px;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--primary);font-weight:650;padding-top:2px;}
  .tl-body{flex:1;min-width:0;}
  .tl-body img{width:100%;max-width:300px;border-radius:8px;display:block;cursor:zoom-in;border:1px solid var(--border);transition:.16s;box-shadow:var(--sh1);}
  .tl-quote{margin-top:6px;font-size:13px;color:#374151;line-height:1.8;}
  .tl-quote span{display:block;}
  .tl-quote span::before{content:"「";color:var(--muted);}
  .tl-quote span::after{content:"」";color:var(--muted);}
  .tl-links{margin-top:6px;display:flex;gap:8px;font-size:12px;}
  .tl-links button{border:none;background:var(--chip);border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--muted);font-size:12px;}
  details{margin-top:6px;}
  summary{cursor:pointer;font-size:13px;color:var(--muted);user-select:none;}
  summary:hover{color:var(--primary);}
  .trans{margin-top:10px;font-size:13.5px;line-height:1.95;color:#374151;max-height:520px;overflow:auto;}
  .trans div{padding:2px 0;border-bottom:1px dotted #f1f2f4;cursor:pointer;}
  .trans div:hover{background:#f8fafc;}
  .trans b{color:var(--primary);font-weight:650;font-variant-numeric:tabular-nums;margin-right:8px;}
  .chip.lv2{background:#eef2ff;color:#4338ca;}
.chip.lv3{background:#f5f3ff;color:#7c3aed;}
.chip.tag{background:#ecfdf5;color:#047857;cursor:pointer;}
.del-btn{margin-left:8px;flex-shrink:0;border:1px solid var(--border);background:#fff;color:#9ca3af;border-radius:8px;width:26px;height:26px;cursor:pointer;font-size:13px;line-height:1;}
.del-btn:hover{border-color:#dc2626;color:#dc2626;background:#fef2f2;}
.tag-edit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;}
.tag-edit select,.tag-edit input{border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:13.5px;font-family:inherit;}
.tag-edit button{border:none;background:var(--primary);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}
.tag-edit button.ghost{background:#fff;color:var(--muted);border:1px solid var(--border);}
.tag-hint{margin-top:8px;font-size:12px;color:var(--muted);}
.anno-area{margin-top:12px;background:#fffbeb;border:1px solid var(--star);border-radius:10px;padding:12px;}
  .anno-area textarea{width:100%;min-height:64px;border:1px solid #fde68a;border-radius:8px;padding:8px;font-size:13.5px;font-family:inherit;resize:vertical;outline:none;}
  .save-row{display:flex;gap:8px;margin-top:8px;}
  .save-row button{border:none;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;background:var(--star);color:#fff;}
  .anno-item{background:#fff;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13.5px;position:relative;}
  .anno-item .del{position:absolute;top:6px;right:8px;border:none;background:none;color:#dc2626;cursor:pointer;font-size:12px;}
  .anno-item .t{font-size:11px;color:var(--muted);display:block;margin-top:4px;}
  .empty{text-align:center;color:var(--muted);padding:40px 0;}
  /* ---- 布局：右侧栏（每日推荐 / 待办速览） ---- */
  .layout{display:flex;gap:22px;max-width:1540px;margin:20px auto 60px;padding:0 24px;align-items:flex-start;}
  .layout main{flex:1;min-width:0;max-width:1180px;margin:0;padding:0;}
  .side{width:308px;flex-shrink:0;position:sticky;top:78px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 96px);overflow:auto;padding-bottom:4px;}
  .side-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 15px;box-shadow:var(--sh1);}
  .side-card h4{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .side-card h4 .mini{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500;cursor:pointer;border:1px solid var(--border);border-radius:999px;padding:1px 8px;background:#fff;}
  .side-card h4 .mini:hover{border-color:var(--primary);color:var(--primary);}
  .side-v{display:block;cursor:pointer;}
  .side-v .sv-t{font-size:13.5px;font-weight:600;line-height:1.5;}
  .side-v .sv-s{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:5px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .side-v .sv-d{font-size:11.5px;color:var(--primary);margin-top:6px;}
  .side-case .sc-title{font-size:13.5px;font-weight:700;color:var(--text);}
  .side-case .sc-act{font-size:12.5px;color:var(--text-2);line-height:1.8;margin-top:6px;}
  .side-case .sc-why{font-size:12px;color:var(--muted);line-height:1.7;margin-top:7px;padding-left:8px;border-left:2px solid var(--primary-line);}
  .side-case .sc-src{font-size:11.5px;color:var(--muted);margin-top:7px;}
  .todo-add{display:flex;gap:6px;margin-bottom:8px;}
  .todo-add input{flex:1;min-width:0;border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit;outline:none;}
  .todo-add input:focus{border-color:var(--primary);}
  .todo-add button{border:none;background:var(--primary);color:#fff;border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;}
  .todo-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .todo-item:last-child{border-bottom:none;}
  .todo-item input[type=checkbox]{margin-top:3px;flex-shrink:0;cursor:pointer;width:15px;height:15px;accent-color:var(--primary);}
  .todo-item .tx{flex:1;min-width:0;line-height:1.6;word-break:break-word;}
  .todo-item.done .tx{text-decoration:line-through;color:var(--muted);}
  .todo-item .tm{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .todo-item .x{border:none;background:none;color:#9ca3af;cursor:pointer;font-size:13px;flex-shrink:0;}
  .todo-item .x:hover{color:var(--danger);}
  .todo-box{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--sh1);margin-bottom:12px;}
  .todo-box .hint{font-size:12.5px;color:var(--muted);margin-top:10px;}
  .todo-tabs{display:flex;gap:6px;margin:10px 0 12px;}
  .todo-tabs button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--text-2);font-family:inherit;}
  .todo-tabs button.on{background:var(--primary-light);border-color:var(--primary-line);color:var(--primary);font-weight:600;}
  .chip.date{background:#f5f3ff;color:#7c3aed;}
  .toolbar button.on{background:var(--primary-light);border-color:var(--primary-line);color:var(--primary);font-weight:600;}
  @media(max-width:1320px){.side{display:none;}.layout{max-width:1180px;}}
  .lightbox{position:fixed;inset:0;background:rgba(15,23,42,.85);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;}
  .lightbox img{max-width:92vw;max-height:92vh;border-radius:10px;}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:60;}
  .toast.show{opacity:1;}
</style>
</head>

<header>
  <div class="h-top">
    <h1>📚 抖音收藏知识库</h1>
    <span class="badge" id="badge"></span>
    <div class="search"><input id="q" placeholder="搜索标题 / 摘要 / 收藏夹 / 作者…" oninput="render()"><button class="btn" onclick="render()">搜索</button></div>

  <nav id="tabs"></nav>
</header>
<div class="layout">

<aside class="side" id="side"></aside>
</div>
<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lb-img"></div>
<div class="toast" id="toast"></div>

// ================= 排序（收藏时间 / 发布时间） =================
function setSortKey(k){ sortKey = (k==="publish" ? "publish" : "collect");
  localStorage.setItem(LS_SORTKEY, sortKey); render(); }
function toggleSort(){ sortAsc = !sortAsc; localStorage.setItem(LS_SORT, sortAsc ? "asc" : "desc");
  const what = sortKey==="collect" ? "收藏时间" : "发布时间";
  toast("已按"+what+"：" + (sortAsc ? "由旧到新" : "由新到旧")); render(); }
function sortLabel(){ return sortKey==="collect" ? "收藏时间" : "发布时间"; }
function sortItems(arr){
  const a = arr.slice();
  if(sortKey==="collect"){
    // cb 越大越新；ci 越小越新（0 = 该夹里最近收藏的那条）；再退回发布时间
    a.sort((x,y)=>{
      const bx=x.cb||0, by=y.cb||0;
      if(bx!==by) return sortAsc ? (bx-by) : (by-bx);
      const cx=(x.ci==null?1e6:x.ci), cy=(y.ci==null?1e6:y.ci);
      if(cx!==cy) return sortAsc ? (cy-cx) : (cx-cy);
      const tx=x.ts||0, ty=y.ts||0;
      if(!tx && !ty) return 0; if(!tx) return 1; if(!ty) return -1;
      return sortAsc ? (tx-ty) : (ty-tx);
    });
    return a;
  }
  a.sort((x,y)=>{ const tx=x.ts||0, ty=y.ts||0;
    if(!tx && !ty) return 0; if(!tx) return 1; if(!ty) return -1;   // 无时间的排最后
    return sortAsc ? (tx-ty) : (ty-tx); });
  return a;
}
// 列表卡片上的日期标签：跟随当前排序口径
function dateChip(v){
  if(sortKey==="collect"){
    if(v.cdate) return '<span class="chip date" title="我收藏这条的时间">🗓 '+esc(v.cdate)+' 收藏</span>';
    if(v.cbefore) return '<span class="chip date" title="我收藏这条的时间">🗂 '+esc(v.cbefore)+' 之前</span>';
    return '';
  }
  return v.date ? '<span class="chip date" title="视频发布时间">🗓 '+esc(v.date)+' 发布</span>' : '';
}

// 必须靠这些按钮才能把改动带回data/。服务端在线时它们会自动隐藏。
function dl(name, obj){
  const b=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  toast("已导出 "+name+"，请放到 data/ 目录后重建");
}
function exportExcluded(){ if(!dels.length){toast("没有待导出的删除");return;} dl("excluded.json",{_说明:"人工删除名单（网页导出）",ids:dels}); }
function exportMarks(){ dl("marks.json",{_说明:"⭐重要 / 🔔回顾 标记（网页导出）",marks:marks}); }
function exportDeleted(){ if(!dels.length){toast("没有待导出的删除");return;}
  const out={}; DATA.forEach(v=>{ if(dels.includes(v.id)) out[v.id]={id:v.id,title:v.title,folder:(v.folder||"")}; });
  dl("removed_by_user.json",{_说明:"网页删除条目快照（含标题，可恢复）",count:dels.length,items:out}); }
function render(){
  renderTabs();
  const list=filtered();
  document.getElementById("badge").textContent=DATA.length+" 条收藏 · "+(WEEKLY.label||"");
  const main=document.getElementById("main");
  if(view==="detail"){
    const v0=DATA.find(x=>x.id===curId);
    const v=v0?effView(v0):null;
    main.innerHTML=v?detail(v):'<div class="empty">未找到</div>';
    sideRender();
    return;
  }
  if(curTab==="todo"){
    const open=todos.filter(t=>!t.done), done=todos.filter(t=>t.done);
    main.innerHTML=
      '<div class="stats">'
      +'<div class="stat"><b>'+open.length+'</b><span>待办未完成</span></div>'
      +'<div class="stat"><b>'+done.length+'</b><span>已完成</span></div>'
      +'<div class="stat"><b>'+todos.length+'</b><span>全部待办</span></div>'
      +'<div class="stat"><b>'+DATA.filter(v=>v.has_transcript).length+'</b><span>已有逐字稿</span></div>'
      +'</div>'
      +'<div class="todo-box"><h3 style="font-size:15px;margin-bottom:9px">✍️ 新增待办</h3>'
      +'<div class="todo-add"><input id="todoInput" placeholder="写下一件要动手做的事（回车即可添加）…" onkeydown="if(event.key===\'Enter\')addTodoFromInput()"><button onclick="addTodoFromInput()">添加</button></div>'
      +'<div class="hint">小提示：在任意视频详情页点「➕ 加入待办」，可以把「看完这条要做什么」直接变成待办。</div></div>'
      +'<div class="todo-box"><h3 style="font-size:15px">⏳ 未完成</h3>'+todoHtml(open)+'</div>'
      +'<div class="todo-box"><h3 style="font-size:15px">✅ 已完成 <button class="x" style="float:right;border:1px solid var(--border);background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)" onclick="clearDoneTodos()">清空已完成</button></h3>'+todoHtml(done)+'</div>';
    sideRender();
    return;
  }
  main.innerHTML=
   '<div class="stats">'
   +'<div class="stat"><b>'+list.length+'</b><span>当前筛选</span></div>'
   +'<div class="stat"><b>'+Object.values(marks).filter(x=>x.important).length+'</b><span>⭐ 重要</span></div>'
   +'<div class="stat"><b>'+Object.values(marks).filter(x=>x.review).length+'</b><span>🔔 待回顾</span></div>'
   +'<div class="stat"><b>'+DATA.filter(v=>v.has_transcript).length+'</b><span>已有逐字稿</span></div>'
   +'</div>'
   +'<div class="toolbar">'
   +'<select class="sortsel" onchange="setSortKey(this.value)" title="选择按什么排序">'
   +'<option value="collect"'+(sortKey==="collect"?" selected":"")+'>🗓 按收藏时间</option>'
   +'<option value="publish"'+(sortKey==="publish"?" selected":"")+'>📤 按发布时间</option>'
   +'</select>'
   +'<button class="'+(sortAsc?"on":"")+'" onclick="toggleSort()" title="点一下切换升序/降序">🕒 '+sortLabel()+'：'+(sortAsc?"旧 → 新":"新 → 旧")+'</button>'
   +(ONLINE?'<button onclick="apiRebuild()">🔄 同步到 Obsidian / 周报</button>'
          :'<button onclick="exportExcluded()" title="把本页删除的条目导出为 excluded.json，放到 data/ 即生效">🗑 导出删除名单'+(dels.length?'('+dels.length+')':'')+'</button>'
           +'<button onclick="exportOverrides()" title="导出手工分类与标签，覆盖到 data/ 后重建即生效">🏷 导出分类修改</button>'
           +'<button onclick="exportMarks()" title="导出 ⭐重要 / 🔔回顾 标记">⭐ 导出标记</button>')
   +'</div>'
   +(WEEKLY.text?'<details class="wk"><summary>📋 本期整理小结（点击展开）</summary><div class="summary-card">'+esc(WEEKLY.text)+'</div></details>':'')
   +'<div id="imp2"></div>'
   +(list.length?list.map(row).join(""):'<div class="empty">没有匹配的内容</div>');
  sideRender();
}
function saveTag(id){
  const m=document.getElementById("sel-major").value;
  const f=document.getElementById("inp-folder").value.trim();
  const l2el=document.getElementById("sel-lv2");
  const l3el=document.getElementById("inp-lv3");
  const l2=l2el?l2el.value.trim():"", l3=l3el?l3el.value.trim():"";
  ovr[id]=ovr[id]||{}; ovr[id].major=m; if(f) ovr[id].folder=f;
  ovr[id].lv2=l2; ovr[id].lv3=l3;
  // 新二级/三级并入体系（本机）
  if(m && MAJORS.indexOf(m)<0) MAJORS.push(m);
  if(m){ TAXO[m]=TAXO[m]||{}; if(l2 && !TAXO[m][l2]) TAXO[m][l2]=[]; if(l2 && l3 && TAXO[m][l2].indexOf(l3)<0) TAXO[m][l2].push(l3); }
  save(LS_OVR,ovr); apiSave("overrides", ovr); render(); toast("已保存：" + m + (l2?(" > "+l2):"") + (l3?(" > "+l3):"") + (ovr[id].tags&&ovr[id].tags.length?(" ｜标签 "+ovr[id].tags.join("、")):""));
}
function resetTag(id){ if(ovr[id]){delete ovr[id];save(LS_OVR,ovr);} render(); toast("已恢复自动分类"); }
function exportOverrides(){const b=new Blob([JSON.stringify({_说明:"人工分类+分级+标签（网页导出）", overrides:ovr, taxonomy:TAXO},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="overrides.json";a.click();
  toast("已导出 overrides.json，放进 data/ 后重建即生效");}
function exportAnno(){const b=new Blob([JSON.stringify(anno,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="抖音收藏批注_备份.json";a.click();}
window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#\/v\/(\d+)/);if(m){curId=m[1];view="detail";render();}});
if(location.hash){const m=location.hash.match(/^#\/v\/(\d+)/);if(m){curId=m[1];view="detail";}}
render();
</script>
